.eq.off span{animation-play-state:paused;transform:scaleY(.3)}

<div style="width:100%;margin-top:auto;text-align:left">
<label for="nm" style="font-size:14px;color:#6a3593;font-weight:500;display:block;margin:0 0 6px 4px">Como você se chama?</label>
<input id="nm" class="fi" style="height:46px" placeholder="Maria" maxlength="30" autocomplete="off">
<div id="nmErr" style="font-size:13px;color:#c0395b;min-height:18px;margin:4px 0 0 4px"></div>
<button id="go" class="bt" style="margin-top:4px"><i class="ti ti-sparkles" aria-hidden="true"></i> Começar o jogo</button>
</div>
</div>
</div>
</div>
</div>
</div>
<script>
const T=150;
const C=[{n:'Pele',i:'ti-droplet',bg:'#fde3ef',fg:'#a8326e'},{n:'Rosto',i:'ti-mood-smile',bg:'#efe3fb',fg:'#6a3593'},{n:'Corpo',i:'ti-bath',bg:'#fde3ef',fg:'#a8326e'},{n:'Cabelo',i:'ti-feather',bg:'#efe3fb',fg:'#6a3593'},{n:'Unhas',i:'ti-brush',bg:'#fde3ef',fg:'#a8326e'}];
const Q=[
[0,'Qual é o seu tipo de pele (seca, oleosa, mista ou sensível) e como você percebeu isso?'],
[0,'Qual produto de skincare você nunca deixa de usar? Por quê?'],
[0,'Você usa protetor solar todos os dias? Conte como é esse hábito para você.'],
[0,'O que você costuma fazer quando aparece uma espinha ou mancha na pele?'],
[1,'Como é a sua rotina de limpeza do rosto de manhã e à noite?'],
[1,'Qual maquiagem faz você se sentir mais confiante e bonita?'],
[1,'Você tira a maquiagem antes de dormir? O que você usa para isso?'],
[1,'Qual parte do seu rosto você mais ama e por quê?'],
[2,'Qual é o seu hidratante ou perfume favorito para o corpo?'],
[2,'Quantos copos de água você costuma beber por dia? Você acha que é suficiente?'],
[2,'Qual atividade ou movimento faz o seu corpo se sentir bem?'],
[2,'Como seria o seu banho relaxante perfeito?'],
[3,'Como você descreveria o seu cabelo: liso, ondulado, cacheado ou crespo? Do que ele mais precisa?'],
[3,'Qual cuidado você mais faz no seu cabelo durante a semana?'],
[3,'Qual penteado faz você se sentir mais linda?'],
[3,'Você já fez uma mudança grande no cabelo? Como você se sentiu?'],
[4,'Qual é a sua cor de esmalte favorita e por que ela combina com você?'],
[4,'Você prefere fazer as unhas em casa ou no salão? Por quê?'],
[4,'Como você cuida das suas cutículas e da hidratação das mãos?'],
[4,'Se você pudesse criar a sua própria nail art, como ela seria?']
];
const D=[['bf',6,58,26,'fl',0,'#b98be0'],['lp',8,104,20,'sw',.2],['sb',6,146,19,'sw',.4],['hh',14,190,12,'fl',1.2,'#f2a0a0'],['es',4,220,22,'sw',.9],['gp',6,262,20,'sw',1],['st',14,306,11,'tw',.5,'#c9a7f0'],['pf',6,336,20,'sw',1.4],['ch',6,380,19,'sw',1.6],['sp',12,424,12,'tw',1.1,'#e86aa6'],['np',8,452,19,'sw',.6],['pc',6,496,18,'sw',.2],['hh',12,538,13,'fl',2,'#f4b0b0'],['lg',8,564,20,'sw',1.9],['fw',6,626,26,'fl',.8,'#f7a8c8'],
['fw',-14,52,22,'fl',2,'#d2b3f2'],['ch',-6,94,18,'sw',.7],['br',-6,130,22,'sw',1.5],['sp',-12,172,12,'tw',.3,'#b98be0'],['wm',-4,198,22,'sw',1.8],['mr',-6,236,22,'sw',.4],['bf',-6,282,22,'fl',1.4,'#f08cbc'],['hh',-14,326,13,'fl',.6,'#f2a0a0'],['bl',-6,352,20,'sw',1.2],['sb',-8,394,18,'sw',1.1],['lp',-8,432,19,'sw',.8],['gp',-6,470,19,'sw',.5],['st',-14,508,12,'tw',1.7,'#f08cbc'],['pf',-8,532,19,'sw',2.1],['bw',-6,570,22,'sw',.9],['es',-6,608,20,'sw',1.3],['sp',-16,648,11,'tw',.4,'#c9a7f0']];
const SCR=document.getElementById('scr');
D.forEach(([s,x,y,z,a,dl,f])=>{const d=document.createElement('div');d.className='dc '+a;d.style.top=y+'px';d.style[x<0?'right':'left']=Math.abs(x)+'px';d.style.animationDelay=dl+'s';d.innerHTML=`<svg width="${z}" height="${z}" ${s==='bf'?'class="fa"':''} aria-hidden="true"><use href="#${s}" ${f?`fill="${f}"`:''}/></svg>`;SCR.insertBefore(d,document.getElementById('sbar'))});
const V=document.getElementById('view');
const START=V.innerHTML;
let S={name:'',i:0,ans:[],t0:0,tm:null};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(t){t=Math.round(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function clk(){const d=new Date();document.getElementById('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
clk();setInterval(clk,15000);

let AC=null,MG,mOn=false,mInt=null,nt=0,st=0,userOff=false,touched=false;
const CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
const MEL=[76,74,72,69,72,74,72,67,69,67,65,64,67,69,72,74];
const AP=[0,-1,1,2,-1,3,2,-1];
const E=60/68/2;
const mf=m=>440*Math.pow(2,(m-69)/12);
function ensureAC(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=0.0001;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1900;const dl=AC.createDelay(1);dl.delayTime.value=E*3;const fb=AC.createGain();fb.gain.value=0.3;const wet=AC.createGain();wet.gain.value=0.35;MG.connect(lp);lp.connect(AC.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination)}
function tone(f,t,a,d,v,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+0.05)}
function sched(){while(nt<AC.currentTime+0.4){const bar=Math.floor(st/8),ch=CH[bar%4],s=st%8;if(s===0){ch.forEach(m=>tone(mf(m),nt,1.2,E*8+0.8,0.035,'sine'));tone(mf(ch[0]-12),nt,0.06,E*7,0.11,'sine')}const ap=AP[s];if(ap>=0)tone(mf(ch[ap]+12),nt,0.01,1.8,0.055,'triangle');if(s===4)tone(mf(MEL[bar%16]+12),nt,0.01,2.2,0.028,'sine');nt+=E;st++}}
function updMB(){document.getElementById('mi').className='ti '+(mOn?'ti-music':'ti-music-off');document.getElementById('mb').style.background=mOn?'#f9cfe3':'#f3e2fb';['eqS','eqQ'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.toggle('off',!mOn)});const l=document.getElementById('smL');if(l)l.textContent=mOn?'Música suave tocando':'Tocar música suave';const q=document.getElementById('qmi');if(q)q.className='ti '+(mOn?'ti-player-pause':'ti-player-play')}
function musicPlay(){ensureAC();AC.resume();if(mOn)return;mOn=true;nt=AC.currentTime+0.1;MG.gain.cancelScheduledValues(AC.currentTime);MG.gain.setTargetAtTime(0.65,AC.currentTime,0.5);mInt=setInterval(sched,80);updMB()}
function musicStop(){if(!mOn)return;mOn=false;clearInterval(mInt);MG.gain.cancelScheduledValues(AC.currentTime);MG.gain.setTargetAtTime(0.0001,AC.currentTime,0.2);updMB()}
function toggleM(){if(mOn){musicStop();userOff=true}else{musicPlay();userOff=false}}
function chime(){if(!mOn||!AC)return;const t=AC.currentTime;tone(mf(84),t,0.005,0.9,0.045,'sine');tone(mf(91),t+0.1,0.005,1.1,0.035,'sine')}
document.getElementById('mb').addEventListener('click',toggleM);
document.querySelector('.ph').addEventListener('pointerdown',e=>{if(touched)return;touched=true;if(e.target.closest('[data-m]'))return;musicPlay()});

function bindStart(){const inp=document.getElementById('nm'),er=document.getElementById('nmErr'),go=document.getElementById('go');document.getElementById('sm').addEventListener('click',toggleM);updMB();inp.addEventListener('input',()=>{er.textContent=''});inp.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});go.addEventListener('click',()=>{const v=inp.value.trim();if(!v){er.textContent='Escreva seu nome para começar';inp.focus();return}S={name:v,i:0,ans:[],t0:0,tm:null};if(!userOff)musicPlay();showQ()})}
bindStart();

function showQ(){clearInterval(S.tm);const [ci,q]=Q[S.i],c=C[ci];let hearts='';for(let k=0;k<20;k++){hearts+=`<svg width="11" height="11" aria-hidden="true"><use href="#hh" fill="${k<S.i?'#f2a0a0':(k===S.i?'#e86aa6':'#f3d3e2')}"/></svg>`}
const fr=['sb','lp','gp','np','ch','pf','wm','es','pc','bl'][S.i%10];
V.innerHTML=`<div class="pop" style="display:flex;flex-direction:column;height:100%">
<div style="display:flex;justify-content:space-between;align-items:center"><span class="chip" style="background:${c.bg};color:${c.fg}"><i class="ti ${c.i}" aria-hidden="true"></i>${c.n}</span><span style="font-size:13px;font-weight:500;color:#7a3e9d">${S.i+1} de 20</span></div>
<div style="display:flex;justify-content:center;gap:2px;margin-top:12px">${hearts}</div>
<div style="display:flex;align-items:center;gap:14px;margin-top:14px">
<div id="tw" style="position:relative;width:74px;height:74px;flex-shrink:0"><svg width="74" height="74" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="30" fill="#fff" stroke="#f6d9e6" stroke-width="6"/><circle id="rg" cx="36" cy="36" r="30" fill="none" stroke="#b06ad8" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="0" transform="rotate(-90 36 36)"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><span id="sec" style="font-size:18px;font-weight:500;color:#5b2b82">2:30</span><span style="font-size:11px;color:#9a6bbd;margin-top:3px">min</span></div></div>
<div style="flex:1;font-size:13px;color:#7a3e9d;line-height:1.45">${esc(S.name)}, essa é a<br>pergunta ${S.i+1}<br><span style="color:#b0709a">Responda do seu jeitinho</span></div>
<svg class="sw" width="34" height="34" aria-hidden="true"><use href="#${fr}"/></svg></div>
<div style="background:#fff;border-radius:20px;padding:18px 16px 16px;margin-top:14px;border:1.5px solid #f6d9e6;position:relative"><svg width="24" height="24" style="position:absolute;top:-13px;left:10px" aria-hidden="true"><use href="#lp"/></svg><svg width="22" height="22" style="position:absolute;top:-12px;left:32px" aria-hidden="true"><use href="#sb"/></svg><svg width="11" height="11" style="position:absolute;top:-5px;left:56px" aria-hidden="true"><use href="#hh" fill="#f2a0a0"/></svg><svg width="11" height="11" style="position:absolute;top:-5px;right:56px" aria-hidden="true"><use href="#st" fill="#c9a7f0"/></svg><svg width="22" height="22" style="position:absolute;top:-12px;right:32px" aria-hidden="true"><use href="#gp"/></svg><svg width="24" height="24" style="position:absolute;top:-13px;right:10px" aria-hidden="true"><use href="#np"/></svg><div style="font-size:16px;font-weight:500;color:#4a2366;line-height:1.45">${q}</div></div>
<textarea id="ans" class="fi" style="height:104px;resize:none;margin-top:12px;line-height:1.5" placeholder="Escreva aqui a sua resposta" maxlength="400"></textarea>
<div id="er" style="font-size:13px;color:#c0395b;min-height:18px;margin:4px 0 0 4px"></div>
<div style="margin-top:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #ecdcf8;border-radius:999px;padding:5px 5px 5px 14px"><span class="eq ${mOn?'':'off'}" id="eqQ"><span></span><span style="animation-delay:.2s"></span><span style="animation-delay:.4s"></span><span style="animation-delay:.1s"></span></span><div style="flex:1;min-width:0;line-height:1.25"><div style="font-size:12px;font-weight:500;color:#6a3593">Doce manhã</div><div style="font-size:11px;color:#a77ab8">música suave de fundo</div></div><button id="qm" data-m="1" aria-label="Tocar ou pausar a música" style="width:30px;height:30px;min-height:0;padding:0;border:none;border-radius:50%;background:#f9cfe3;color:#a8326e;display:flex;align-items:center;justify-content:center;cursor:pointer"><i id="qmi" class="ti ${mOn?'ti-player-pause':'ti-player-play'}" style="font-size:15px" aria-hidden="true"></i></button></div>
<button id="nx" class="bt" style="margin-top:8px">${S.i<19?'Próxima':'Finalizar'} <i class="ti ti-arrow-right" aria-hidden="true"></i></button></div>`;
const ta=document.getElementById('ans');ta.addEventListener('input',()=>{document.getElementById('er').textContent=''});document.getElementById('nx').addEventListener('click',()=>next(false));document.getElementById('qm').addEventListener('click',toggleM);ta.focus();
S.t0=Date.now();tick();S.tm=setInterval(tick,250)}

function tick(){const rg=document.getElementById('rg');if(!rg)return;const el=(Date.now()-S.t0)/1000,left=Math.max(0,T-el);rg.setAttribute('stroke-dashoffset',(188.5*(1-left/T)).toFixed(1));const se=document.getElementById('sec');se.textContent=fmt(Math.ceil(left));if(left<=20){rg.setAttribute('stroke','#ee8f8f');se.style.color='#d0606a';document.getElementById('tw').classList.add('pu')}if(left<=0)next(true)}

function next(to){const ta=document.getElementById('ans');const v=ta?ta.value.trim():'';if(!to&&!v){document.getElementById('er').textContent='Escreva sua resposta antes de continuar';ta.focus();return}clearInterval(S.tm);const [ci,q]=Q[S.i];S.ans.push({ci,q,a:v,sec:Math.min(T,(Date.now()-S.t0)/1000)});chime();S.i++;if(S.i<Q.length)showQ();else showEnd()}

function rain(){const sy=['hh','sb','lp','gp','bf','np','ch','fw','pf','wm','st','es','pc','bl'],cl={hh:'#f2a0a0',bf:'#b98be0',fw:'#f7a8c8',st:'#e86aa6'};for(let k=0;k<30;k++){const d=document.createElement('div');d.className='fall';const z=Math.round(14+Math.random()*16);d.style.left=Math.round(Math.random()*290)+'px';d.style.animationDelay=(Math.random()*1.4).toFixed(2)+'s';const s=sy[k%sy.length],f=cl[s];d.innerHTML=`<svg width="${z}" height="${z}" aria-hidden="true"><use href="#${s}" ${f?`fill="${f}"`:''}/></svg>`;SCR.appendChild(d);setTimeout(()=>d.remove(),5200)}}

function showEnd(){clearInterval(S.tm);const answered=S.ans.filter(a=>a.a).length;const tot=S.ans.reduce((x,a)=>x+a.sec,0);let list='';
C.forEach((c,ci)=>{list+=`<div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:${c.fg};margin:10px 0 2px"><i class="ti ${c.i}" aria-hidden="true"></i>${c.n}</div>`;S.ans.forEach((a,k)=>{if(a.ci!==ci)return;list+=`<div style="padding:6px 0 8px;border-bottom:1px dashed #f3d3e2"><div style="font-size:12px;color:#9a6bbd;line-height:1.4">${k+1}. ${a.q}</div><div style="font-size:14px;color:#4a2366;line-height:1.45;margin-top:2px">${a.a?esc(a.a):'<span style="color:#d0606a">Tempo esgotado</span>'}</div></div>`})});
let top='';['lp','sb','st','gp','hh','pf','ch','st','np'].forEach((s,k)=>{const f=s==='st'?'fill="#c9a7f0"':(s==='hh'?'fill="#f2a0a0"':'');const z=s==='st'?13:(s==='hh'?20:22);top+=`<svg class="${s==='st'?'tw':'sw'}" width="${z}" height="${z}" style="animation-delay:${k*0.3}s" aria-hidden="true"><use href="#${s}" ${f}/></svg>`});
V.innerHTML=`<div class="pop" style="display:flex;flex-direction:column;height:100%;text-align:center">
<div style="display:flex;justify-content:center;align-items:center;gap:4px;margin-top:2px">${top}</div>
<div style="font-family:'Dancing Script',cursive;font-size:34px;color:#c2408a;line-height:1.15;margin-top:4px">Parabéns, ${esc(S.name)}!</div>
<div style="font-size:14px;color:#7a3e9d;margin-top:2px">Seu diário de autocuidado está pronto</div>
<div style="display:flex;gap:8px;margin-top:12px"><div style="flex:1;background:#fff;border-radius:16px;padding:8px;border:1.5px solid #f6d9e6"><div style="font-size:20px;font-weight:500;color:#c2408a">${answered}/20</div><div style="font-size:11px;color:#9a6bbd">respondidas</div></div><div style="flex:1;background:#fff;border-radius:16px;padding:8px;border:1.5px solid #ecdcf8"><div style="font-size:20px;font-weight:500;color:#7a3e9d">${fmt(tot)}</div><div style="font-size:11px;color:#9a6bbd">tempo total</div></div></div>
<div style="flex:1;min-height:0;overflow-y:auto;margin-top:12px;text-align:left;background:#fff;border-radius:18px;border:1.5px solid #f6d9e6;padding:4px 14px 8px">${list}</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><button id="np" class="bt"><i class="ti ti-heart" aria-hidden="true"></i> Próxima jogadora</button><button id="rp" class="bt2"><i class="ti ti-refresh" aria-hidden="true"></i> Jogar de novo</button></div></div>`;
document.getElementById('np').addEventListener('click',()=>{V.innerHTML=START;bindStart()});
document.getElementById('rp').addEventListener('click',()=>{S.i=0;S.ans=[];showQ()});
rain()}
</script>
</body>
</html>
